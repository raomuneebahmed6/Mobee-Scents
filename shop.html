<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop All Fragrances | Mobee Scents</title>
  <meta name="description" content="Browse the full Mobee Scents collection — filter by fragrance family, search by note, and sort by price or rating." />
  <meta name="theme-color" content="#2B1B3D" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body data-page="shop">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div id="top-bar-root"></div>
  <div id="site-header"></div>
  <div id="search-overlay-root"></div>
  <div id="cart-drawer-root"></div>
  <div id="quickview-root"></div>

  <main id="main-content">
    <div class="page-head">
      <p class="section-label">The Full Collection</p>
      <h1>Shop All Fragrances</h1>
      <p>Search, filter, and sort our collection to find the composition that fits you.</p>
    </div>

    <div class="section" style="padding-top:1rem;">
      <div class="shop-toolbar">
        <div class="shop-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.2" y2="16.2"/></svg>
          <input type="text" id="shopSearchInput" placeholder="Search fragrances…" />
        </div>
        <div class="shop-toolbar-right">
          <button class="filters-toggle" id="filtersToggleBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
            Filters
          </button>
          <label class="sort-label">Sort by
            <select id="shopSortSelect">
              <option value="featured">Featured</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Top Rated</option>
            </select>
          </label>
        </div>
      </div>

      <div class="filter-row" id="shopFilterRow"></div>

      <div class="product-grid shop-grid" id="shopGrid"></div>
      <div class="shop-empty" id="shopEmpty" hidden>
        <h3>No fragrances match your search</h3>
        <p>Try a different search term or clear your filters.</p>
        <button id="shopClearFilters">Clear filters</button>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/reveal.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/product-card.js"></script>
  <script src="assets/js/quickview.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
